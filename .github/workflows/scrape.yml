name: Scrape

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          busy=$(gh run list -R "$GITHUB_REPOSITORY" -w scrape.yml -L 20 --json databaseId,status \
            -q "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and .status != \"completed\")] | length")
          if [ "$busy" -gt 0 ]; then
            echo "接力抓取正在进行，本次定时触发跳过"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: scrape
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.APP_REPO || format('{0}/love', github.repository_owner) }}
          path: app

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/scraper/requirements.txt

      - run: pip install -r app/scraper/requirements.txt

      - name: Scrape
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          DATA_DIR: ${{ github.workspace }}/data
          MAX_RUNTIME_MIN: ${{ vars.SCRAPE_MINUTES || '57' }}
        run: |
          code=0
          python app/scraper/scrape.py || code=$?
          if [ "$code" -eq 1 ]; then
            echo "::warning::部分群抓取失败，详见日志；其余群已保存，接力继续"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Commit
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "没有新内容"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "archive: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN 推送的提交不会触发其他工作流，所以在这里直接调用发布
  pages:
    needs: scrape
    if: ${{ !cancelled() && needs.scrape.outputs.changed == 'true' }}
    uses: ./.github/workflows/pages.yml

  next:
    needs: scrape
    if: ${{ needs.scrape.result == 'success' && vars.SCRAPE_LOOP != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          gh workflow run scrape.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
